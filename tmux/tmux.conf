set -g default-command "zsh -l"

##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'


##### tmux-resurrect / continuum #####

set -g @continuum-restore 'on'

# Do not try to restart Claude/Codex/etc. Just restore sessions, panes, dirs/layouts.
set -g @resurrect-processes 'false'

# Do not save pane contents.
set -g @resurrect-capture-pane-contents 'off'

# Simpler save strategy.
set -g @resurrect-save-command-strategy 'pgrep'

# Snapshot each pane's Claude session id by position at every resurrect save, so
# a restored pane can find which session to `claude --resume`. See
# github.com/dabd/save-our-sessions (tmux-session-recovery plugin).
set -g @resurrect-hook-post-save-all '"$HOME/tools/save-our-sessions/plugins/tmux-session-recovery/scripts/tmux-agent-snapshot.sh"'


##### Ghostty / Claude Code / Codex #####

# Let terminal features pass through tmux.
set -g allow-passthrough on

# extended-keys OFF: the kitty/CSI-u protocol mangles multi-line paste (pasted
# newlines arrive CSI-u-encoded and render as literal 'j'). With it off, paste is
# clean. Shift+Enter (newline-in-prompt) is handled instead by a Ghostty keybind
# that emits a bare line feed (see ~/.config/ghostty/config), which Claude Code
# treats as newline-insert with no protocol needed.
set -s extended-keys off
set -as terminal-features ',xterm*:RGB'

# True colour inside tmux.
set -g default-terminal "tmux-256color"

# Mouse support: trackpad scroll, pane clicking, resizing.
set -g mouse on

# Renumber windows when one is closed.
set -g renumber-windows on

# vi-style copy mode.
setw -g mode-keys vi

# Large tmux scrollback, in lines, per pane.
set -g history-limit 100000


##### macOS clipboard / copy-mode #####

# macOS clipboard support for tmux 3.2+.
set -s copy-command 'pbcopy'

# Keyboard selection/copy.
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-pipe-and-cancel
bind -Tcopy-mode-vi Enter send -X copy-pipe-and-cancel

# Mouse drag selection copies to macOS clipboard.
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel


##### Session/window chooser (MRU, fzf) #####

# Most-recently-USED order, emacs-buffer-list style, with a live preview of
# each candidate's active pane.
#  - Sessions sort by session_last_attached (native attention timestamp).
#  - Windows sort by @lf, a monotonic focus counter stamped below on switch
#    (tmux has no window_last_attached; window_activity is output-based, which
#    would wrongly float panes that merely print output, e.g. running agents).
# display-popup -E (not run-shell): fzf needs a real terminal; run-shell runs
# detached with no tty and fzf would abort.
bind s display-popup -E -w 70% -h 60% '~/.config/tmux/scripts/tmux-pick-session.sh'
bind w display-popup -E -w 70% -h 60% '~/.config/tmux/scripts/tmux-pick-window.sh'

# Focus counter for window MRU: bump a global clock and stamp the window just
# switched to. Runs natively (synchronous) so it records the triggering window,
# not whatever is current when a deferred shell would have run. @clk is left
# uninitialized on purpose: arithmetic on an unset value starts at 1, and NOT
# resetting it here means a config reload preserves the counter instead of
# stomping it below existing @lf stamps (which would scramble MRU order).
set-hook -g session-window-changed 'set -gF @clk "#{e|+:#{@clk},1}" ; set -wF @lf "#{e|+:#{@clk},0}"'


##### Status bar #####

# Default status-left-length is 10, which clips longer session names.
# Widen it to fit the full session name.
set -g status-left-length 30


##### TPM bootstrap #####
# Keep this line at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'